<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #status-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video-player" autoplay loop muted>
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div id="status-overlay"></div>
    <div id="error-message" class="error-message"></div>

    <script>
        const video = document.getElementById('video-player');
        const statusOverlay = document.getElementById('status-overlay');
        const errorMessage = document.getElementById('error-message');
        let currentVideoPath = '';
        let pollInterval = null;

        // Initialize video player state
        function initPlayer() {
            console.log('Initializing video player...');
            pollServerState();

            // Poll server state every 2 seconds
            pollInterval = setInterval(pollServerState, 2000);

            // Handle video events
            video.addEventListener('play', () => {
                console.log('Video started playing');
                hideError();
            });

            video.addEventListener('pause', () => {
                console.log('Video paused');
            });

            video.addEventListener('error', (e) => {
                console.error('Video error:', e);
                showError('Failed to load video');
            });

            video.addEventListener('loadedmetadata', () => {
                console.log('Video metadata loaded');
                video.volume = 1.0; // Full volume
            });
        }

        // Poll server for current state
        async function pollServerState() {
            try {
                const response = await fetch('/api/player/state');
                if (!response.ok) {
                    throw new Error('Failed to fetch player state');
                }

                const state = await response.json();
                console.log('Server state:', state);

                // Update video source if changed
                if (state.video_path && state.video_path !== currentVideoPath) {
                    loadVideo(state.video_path);
                }

                // Handle play/pause state
                if (state.should_play && video.paused) {
                    video.play().catch(e => console.error('Play failed:', e));
                } else if (!state.should_play && !video.paused) {
                    video.pause();
                }

                // Update mute state
                video.muted = state.muted || false;

            } catch (error) {
                console.error('Error polling server state:', error);
            }
        }

        // Load a new video
        function loadVideo(videoPath) {
            console.log('Loading video:', videoPath);
            currentVideoPath = videoPath;

            const source = video.querySelector('source');
            source.src = videoPath;
            video.load();

            // Auto-play when loaded
            video.addEventListener('loadeddata', () => {
                video.play().catch(e => {
                    console.error('Auto-play failed:', e);
                    showError('Auto-play blocked. Click to play.');
                });
            }, { once: true });
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Hide error message
        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initPlayer);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });

        // Handle visibility change (pause when tab is hidden)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Page hidden');
            } else {
                console.log('Page visible');
                pollServerState(); // Immediately sync state when page becomes visible
            }
        });
    </script>
</body>
</html>
